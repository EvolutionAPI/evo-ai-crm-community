# Google Ads API própria (não é a mesma conexão OAuth do Google Login/GTM):
# a Ads API exige um developer token além do OAuth de 3 pernas, então fica
# mais simples pedir as 6 credenciais prontas (mesmo jeito que a rotina que
# já roda hoje no n8n usa) em vez de outro fluxo de autorização.
google_ads:
  id: google_ads
  logo: google_ads.png
  i18n_key: google_ads
  hook_type: account
  allow_multiple_hooks: false
  settings_json_schema:
    {
      "type": "object",
      "properties":
        {
          "client_id": { "type": "string" },
          "client_secret": { "type": "string" },
          "refresh_token": { "type": "string" },
          "developer_token": { "type": "string" },
          "login_customer_id": { "type": "string" },
          "customer_id": { "type": "string" }
        },
      "required": ["client_id", "client_secret", "refresh_token", "developer_token", "customer_id"],
      "additionalProperties": false
    }
  settings_form_schema:
    [
      { "label": "Client ID (OAuth)", "type": "text", "name": "client_id", "validation": "required" },
      { "label": "Client Secret (OAuth)", "type": "text", "name": "client_secret", "validation": "required" },
      { "label": "Refresh Token", "type": "text", "name": "refresh_token", "validation": "required" },
      { "label": "Developer Token", "type": "text", "name": "developer_token", "validation": "required" },
      { "label": "ID da conta gerenciadora (MCC, opcional)", "type": "text", "name": "login_customer_id" },
      { "label": "ID da conta de anúncios (Customer ID)", "type": "text", "name": "customer_id", "validation": "required" },
    ]
  visible_properties: ["customer_id"]
