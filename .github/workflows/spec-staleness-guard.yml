name: spec-staleness-guard

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/models/inbox.rb'
      - 'app/models/pipeline.rb'
      - 'app/models/pipeline_item.rb'
      - 'app/models/pipeline_stage.rb'
      - 'app/models/conversation.rb'
      - 'app/models/contact.rb'
      - 'app/models/role.rb'
      - 'app/services/automation_rules/**'
      - 'app/services/pipelines/**'
      - 'app/listeners/automation_rule_listener*.rb'
      - 'app/listeners/pipeline_stage_automation_listener.rb'
      - 'app/listeners/action_cable_listener.rb'
      - 'app/jobs/action_cable_broadcast_job.rb'
      - 'spec/services/automation_rules/**'
      - 'spec/services/pipelines/**'
      - 'spec/listeners/automation_rule_listener_attribute_changed_spec.rb'
      - 'spec/listeners/pipeline_stage_automation_listener_spec.rb'
      - 'spec/listeners/action_cable_listener_conversation_update_spec.rb'
      - 'spec/jobs/action_cable_broadcast_job_spec.rb'
      - 'spec/models/conversation_label_dispatch_spec.rb'
      - 'spec/models/pipeline_item_spec.rb'
      - 'spec/models/pipeline_spec.rb'
      - 'spec/models/role_spec.rb'
      - 'spec/requests/api/v1/contacts_spec.rb'
      - 'spec/channels/room_channel_spec.rb'
      # EVO-2186: the contact/conversation delete paths clean FK dependencies by
      # hand, so the code that does it must trigger the specs that cover it.
      - 'app/controllers/api/v1/contacts_controller.rb'
      - 'app/jobs/delete_object_job.rb'
      - 'spec/jobs/delete_object_job_spec.rb'
      # EVO-2122: dropping is_active from the update permit made deactivation a
      # silent no-op that still answered 200. The regression is invisible to every
      # other lane, so the controller has to trigger the spec that proves it.
      - 'app/controllers/api/v1/pipelines_controller.rb'
      - 'spec/requests/api/v1/pipelines_activation_spec.rb'
      # EVO-2222: `team` visibility lives in one shared scope, and team_ids only survives
      # the write because it is read outside the ParamsWrapper envelope. Neither shows up
      # in another lane, so the code that carries them triggers the specs that prove it.
      - 'app/policies/pipeline_policy.rb'
      - 'spec/policies/pipeline_policy/scope_spec.rb'
      - 'spec/requests/api/v1/pipelines_team_visibility_spec.rb'
      # EVO-2203: these endpoints are how a journey writes into a pipeline. The
      # archived refusal is the only thing stopping it from filling a board the
      # operator turned off, and no other lane exercises it.
      - 'app/controllers/api/v1/pipeline_items_controller.rb'
      - 'app/controllers/api/v1/pipeline_tasks_controller.rb'
      - 'spec/requests/api/v1/pipeline_items_archived_spec.rb'
      - 'spec/controllers/api/v1/pipeline_tasks_controller_spec.rb'
      # The resolver picks the service every new blob is born on, and the test
      # service is what an operator trusts to confirm it. Only these specs prove
      # both read the ENV ahead of a stale DB row instead of the ephemeral disk.
      - 'config/initializers/active_storage_dynamic_service.rb'
      - 'spec/initializers/active_storage_dynamic_service_spec.rb'
      - 'app/services/config_test/storage_test_service.rb'
      - 'spec/services/config_test/storage_test_service_spec.rb'
      # The admin config groups decide which keys a save may write, and the masking
      # keeps credentials out of the response. Neither shows up in another lane.
      - 'app/controllers/api/v1/admin/app_configs_controller.rb'
      - 'spec/controllers/api/v1/admin/app_configs_controller_spec.rb'
      # A macro only reports `failed` because ActionParamGuards validates the
      # param before delegating to the shared handler. Loosening that guard
      # brings back the silent success — and the junk label — invisibly to every
      # other lane.
      - 'app/services/macros/**'
      - 'spec/services/macros/**'
      - 'spec/requests/api/v1/macros_spec.rb'
      # The webhook body and the realtime payload are the same hash, told apart only
      # by `include_labels_data:`. Wiring `webhook_data` back to the default ships
      # `labels_data` to every customer integration; dropping the field leaves the
      # label invisible until a reload. Neither shows up in another lane.
      - 'app/presenters/conversations/event_data_presenter.rb'
      - 'app/models/concerns/push_data_helper.rb'
      - 'spec/presenters/conversations/event_data_presenter_spec.rb'
      - 'spec/models/concerns/push_data_helper_spec.rb'
      # CRM-177: the contacts screen unwraps every response by `data.data`, so a
      # bare `render json:` on the notes endpoints reads on screen as "the note
      # did not save" — the list renders empty with the note in the database.
      # Nothing else consumes these endpoints, so no other lane catches it.
      - 'app/controllers/api/v1/contacts/notes_controller.rb'
      - 'spec/requests/api/v1/contacts/notes_spec.rb'
      # CRM-187: the settings screen asks this endpoint whether the legacy AI
      # fallback still serves, because the credential list cannot tell "migrated
      # and off" from "not migrated". Hardwiring either half of the guard makes
      # the screen claim AI is running while it is disabled — and no other lane
      # touches Ai::MigrationState or this endpoint.
      - 'app/controllers/api/v1/ai_credentials_controller.rb'
      - 'app/services/ai/migration_state.rb'
      - 'spec/requests/api/v1/ai_credentials_migration_state_spec.rb'
      - 'spec/services/ai/migration_state_spec.rb'

permissions:
  contents: read

env:
  RAILS_ENV: test
  ENCRYPTION_KEY: test-encryption-key-for-fernet!!
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DATABASE: evolution_test

jobs:
  spec-staleness:
    name: Spec staleness guard (EVO-1141)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:schema:load

      - name: Run staleness-guard specs
        run: |
          bundle exec rspec \
            spec/services/automation_rules/action_service_spec.rb \
            spec/services/automation_rules/conditions_filter_service_spec.rb \
            spec/services/pipelines/stage_automation_service_spec.rb \
            spec/listeners/automation_rule_listener_attribute_changed_spec.rb \
            spec/listeners/pipeline_stage_automation_listener_spec.rb \
            spec/listeners/action_cable_listener_conversation_update_spec.rb \
            spec/jobs/action_cable_broadcast_job_spec.rb \
            spec/models/conversation_label_dispatch_spec.rb \
            spec/models/pipeline_item_spec.rb \
            spec/models/pipeline_spec.rb \
            spec/models/role_spec.rb \
            spec/requests/api/v1/contacts_spec.rb \
            spec/requests/api/v1/pipelines_activation_spec.rb \
            spec/requests/api/v1/pipelines_team_visibility_spec.rb \
            spec/policies/pipeline_policy/scope_spec.rb \
            spec/requests/api/v1/pipeline_items_archived_spec.rb \
            spec/controllers/api/v1/pipeline_tasks_controller_spec.rb \
            spec/jobs/delete_object_job_spec.rb \
            spec/channels/room_channel_spec.rb \
            spec/lib/global_config_service_spec.rb \
            spec/initializers/active_storage_dynamic_service_spec.rb \
            spec/services/config_test/storage_test_service_spec.rb \
            spec/controllers/api/v1/admin/app_configs_controller_spec.rb \
            spec/services/macros/execution_service_spec.rb \
            spec/requests/api/v1/macros_spec.rb \
            spec/presenters/conversations/event_data_presenter_spec.rb \
            spec/models/concerns/push_data_helper_spec.rb \
            spec/requests/api/v1/contacts/notes_spec.rb \
            spec/requests/api/v1/ai_credentials_migration_state_spec.rb \
            spec/services/ai/migration_state_spec.rb \
            --format progress
