name: erp-spec-check (EVO-1735 temporary)

# Temporary workflow scoped to the EVO-1735 branch — runs the 2 ERP
# webhook specs that the existing community CI does not cover. Should
# be removed before merge.

on:
  push:
    branches: [marcelo/evo-1735-erp-webhook-infra]

permissions:
  contents: read

env:
  RAILS_ENV: test
  ENCRYPTION_KEY: test-encryption-key-for-fernet!!
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DATABASE: evolution_test

jobs:
  erp-specs:
    name: ERP webhook specs (EVO-1735)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:schema:load

      - name: Run ERP webhook specs
        run: |
          bundle exec rspec \
            spec/lib/webhooks/erp_adapters_spec.rb \
            spec/requests/api/v1/webhooks/erp_spec.rb \
            --format documentation
